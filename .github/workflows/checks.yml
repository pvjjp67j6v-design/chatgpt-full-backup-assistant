name: Build and check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Windows app
        shell: pwsh
        run: ./程序源码/build.ps1
      - name: Check export engine and retry path
        run: node ./程序源码/test-engine.cjs
      - name: Check local file validation
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './ChatGPT全量备份助手.exe' -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Self-test failed' }
          Get-Content -LiteralPath './自检结果.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Backup-Assistant-Windows
          path: |
            ChatGPT全量备份助手.exe
            使用说明.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
            程序源码/LICENSE-exporter.txt
            程序源码/LICENSE-jszip.txt
